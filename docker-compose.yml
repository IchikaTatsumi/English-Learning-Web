version: '3.9'

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🐳 ENGLISH LEARNING WEB APP - DOCKER COMPOSE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Services:
# 1. Postgres DB (Port 5432 -> 9999)
# 2. Backend API (Port 4000)
# 3. MinIO Storage (Port 9000, 9001)
# 4. Speech Service (Port 8000)
# 5. PgAdmin (Optional, Port 5050)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🗄️ PostgreSQL Database
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  postgres:
    image: postgres:16-alpine
    container_name: english_learning_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: english_learning
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "9999:5432"
    volumes:
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d english_learning']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 📦 MinIO (S3 Compatible Storage for TTS)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  minio:
    image: minio/minio:latest
    container_name: english_learning_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    volumes:
      - minio_data:/data
    networks:
      - app_network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🎤 Speech Service (Python FastAPI + Vosk)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  speech-service:
    build: 
      context: ./speech-service
      dockerfile: Dockerfile
    container_name: speech_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 👇 QUAN TRỌNG: Map folder model từ máy host vào Docker
      # Đảm bảo bạn đã giải nén model vào folder này trên máy tính
      - ./speech-service/speech-recognition/models:/app/speech-recognition/models
      
      # (Tuỳ chọn) Map code để dev hot-reload, loại trừ folder models để tránh conflict
      # - ./speech-service:/app
    env_file:
      - ./speech-service/.env
    depends_on:
      - minio
    networks:
      - app_network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🔧 Backend (NestJS)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: english_learning_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      speech-service:
        condition: service_started
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      DB_DATABASE: english_learning
      
      # TypeORM
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: english_learning
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-mysecret}
      JWT_EXPIRES_IN: 24h
      
      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      
      # Speech Service URL (Docker Internal Network)
      SPEECH_SERVICE_URL: http://speech-service:8000
      
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "4000:4000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app_network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🗂️ pgAdmin (Optional)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: english_learning_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@english-learning.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app_network
    profiles:
      - debug

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📦 Volumes
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  postgres_data:
    driver: local
    name: english_learning_postgres_data
  
  postgres_logs:
    driver: local
    name: english_learning_postgres_logs
  
  backend_logs:
    driver: local
    name: english_learning_backend_logs
  
  pgadmin_data:
    driver: local
    name: english_learning_pgadmin_data

  minio_data:   # 👈 Volume mới cho MinIO
    driver: local
    name: english_learning_minio_data

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🌐 Networks
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
networks:
  app_network:
    driver: bridge
    name: english_learning_network