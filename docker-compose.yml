version: '3.9'

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🐳 ENGLISH LEARNING WEB APP - DOCKER COMPOSE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Configuration for: Frontend (local npm) + Backend (Docker) + Database (Docker)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🗄️ PostgreSQL Database
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  postgres:
    image: postgres:16-alpine
    container_name: english_learning_db
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: english_learning
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: Asia/Ho_Chi_Minh
    
    ports:
      # ⚠️ CRITICAL: Port mapping for local access
      # Host:Container
      # - Backend in Docker connects via: postgres:5432 (internal)
      # - Backend local (npm) connects via: localhost:9999 (if needed)
      - "9999:5432"
    
    volumes:
      # Init database script - runs once on first startup
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
      
      # Postgres logs (optional but useful for debugging)
      - postgres_logs:/var/log/postgresql
    
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d english_learning']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - app_network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🔧 Backend (NestJS)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: english_learning_backend
    restart: unless-stopped
    
    depends_on:
      postgres:
        condition: service_healthy
    
    # ✅ Option 1: Load environment from file
    env_file:
      - ./backend/.env.production
    
    # ✅ Option 2: Override specific values (takes precedence)
    environment:
      # Node Environment
      NODE_ENV: production
      PORT: 4000
      
      # Database Configuration
      # ⚠️ CRITICAL: Use service name for Docker internal network
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      DB_DATABASE: english_learning
      
      # TypeORM Data Source (same as above)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: english_learning
      
      # JWT Configuration
      # ⚠️ Override from root .env if exists: JWT_SECRET=xxx docker-compose up
      JWT_SECRET: ${JWT_SECRET:-mysecret}
      JWT_EXPIRES_IN: 24h
      
      # Frontend URL (for CORS)
      # ⚠️ IMPORTANT: Frontend runs on host machine at localhost:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      
      # Speech Service URL
      # If Speech Service runs in Docker: http://speech-service:8000
      # If Speech Service runs local: http://host.docker.internal:8000
      SPEECH_SERVICE_URL: ${SPEECH_SERVICE_URL:-http://speech-service:8000}
      
      # Timezone
      TZ: Asia/Ho_Chi_Minh
    
    ports:
      # ⚠️ CRITICAL: Expose backend API to host
      # Frontend (running on host) connects via: http://localhost:4000/api
      - "4000:4000"
    
    volumes:
      # Application logs (optional but useful)
      - backend_logs:/app/logs
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - app_network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🗂️ pgAdmin (Database Management - Optional)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: english_learning_pgadmin
    restart: unless-stopped
    
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@english-learning.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    
    ports:
      - "5050:80"
    
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    
    depends_on:
      - postgres
    
    networks:
      - app_network
    
    profiles:
      # Only start pgAdmin with: docker-compose --profile debug up
      - debug

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📦 Volumes
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  postgres_data:
    driver: local
    name: english_learning_postgres_data
  
  postgres_logs:
    driver: local
    name: english_learning_postgres_logs
  
  backend_logs:
    driver: local
    name: english_learning_backend_logs
  
  pgadmin_data:
    driver: local
    name: english_learning_pgadmin_data

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🌐 Networks
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
networks:
  app_network:
    driver: bridge
    name: english_learning_network