version: '3.8'

services:
  # Service Database
  postgres:
    image: postgres:16-alpine
    container_name: english_learning_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}         # Lấy từ file .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Lấy từ file .env
      POSTGRES_DB: ${POSTGRES_DB}             # Lấy từ file .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: english_learning_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy # Đợi DB khỏe mới chạy
    environment:
      # Cấu hình Database (Quan trọng nhất)
      POSTGRES_HOST: postgres        # Tên service của container database
      POSTGRES_PORT: 5432            # Port nội bộ của container (luôn là 5432)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
      # Cấu hình App
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      SPEECH_SERVICE_URL: http://speech-service:8000
    ports:
      - "4000:4000"
    networks:
      - app_network

  # Service Speech (Python)
  speech-service:
    build:
      context: ./speech-service
      dockerfile: Dockerfile
    container_name: speech_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge